<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Missions – RoboAgri-Kin</title>
<link href="vendor/bootstrap.min.css" rel="stylesheet">
<link href="vendor/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body data-page="missions"><main>
<h1 class="h3 mb-4" style="color:var(--vf)">Missions</h1>
<section class="carte mb-4"><h2>Préparer une mission</h2>
<form id="missionForm" class="row g-3">
<div class="col-md-5"><label class="form-label" for="missionDate">Date et heure prévues <span class="text-danger">*</span></label><input class="form-control" id="missionDate" type="datetime-local" required></div>
<div class="col-md-7"><label class="form-label" for="missionZones">Zones à visiter (sélectionnez-les dans l'ordre souhaité) <span class="text-danger">*</span></label><select class="form-select" id="missionZones" multiple size="4" required aria-describedby="missionOrderHelp"></select><div id="missionOrderHelp" class="form-text">Les zones choisies apparaissent dans l’ordre de sélection. Utilisez les boutons pour ajuster cet ordre.</div></div>
<div class="col-md-7"><div class="d-flex align-items-center gap-2 flex-wrap"><span class="small fw-semibold">Ordre des étapes :</span><ol id="missionOrder" class="ordered-steps mb-0" aria-live="polite"></ol></div>
<div class="d-flex gap-2 mt-2"><button class="btn btn-sm btn-outline-secondary" id="moveStepUp" type="button">Monter</button><button class="btn btn-sm btn-outline-secondary" id="moveStepDown" type="button">Descendre</button></div></div>
<div class="col-12"><button class="btn btn-success" type="submit">Enregistrer la mission planifiée</button></div>
</form></section>
<section class="carte"><h2>Missions et résultats reçus</h2><div id="tableau"></div></section>
</main>
<script src="vendor/plotly.min.js"></script>
<script src="vendor/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script><script src="js/api.js"></script><script src="js/app.js"></script></body></html>
