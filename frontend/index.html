<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tableau de bord – RoboAgri-Kin</title>
<link href="vendor/bootstrap.min.css" rel="stylesheet">
<link href="vendor/bootstrap-icons.css" rel="stylesheet">

<body data-page="index"><main>
<h1 class="h3 mb-4" style="color:var(--vf)">Tableau de bord</h1>
<div class="row g-4 mb-4">
<div class="col-sm-6 col-xl-3"><div class="carte kpi"><div class="lib">État du robot</div><div class="mt-2" id="etat"></div></div></div>
<div class="col-sm-6 col-xl-3"><div class="carte kpi"><div class="lib">Dernière communication</div><div class="small mt-2" id="derniereCom">—</div></div></div>
<div class="col-sm-6 col-xl-3"><div class="carte kpi"><div class="val" id="nbParcelles">—</div><div class="lib">Parcelles</div></div></div>

<div class="col-sm-6 col-xl-3"><div class="carte kpi"><div class="val" id="nbMissions"></div><div class="lib">Missions terminées</div></div></div></div>
<div class="row g-4 mb-4"><div class="col-lg-8"><div class="carte"><h2>Évolution de l'humidité (valeur brute)</h2><div class="chart" id="graph"></div></div></div>
<div class="col-lg-4"><div class="carte kpi"><div class="val" id="arrosagesRecents"></div><div class="lib">Arrosages reçus (7 derniers jours)</div></div></div></div>
<div class="carte"><h2>5 dernières activités</h2><div id="activites"></div></div>
</main>
<script src="vendor/plotly.min.js"></script>
