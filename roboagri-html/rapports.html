<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rapports et statistiques – RoboAgri-Kin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23183d32'/><text x='50' y='68' font-size='56' text-anchor='middle'>🌱</text></svg>">
<meta name="description" content="Consultez les statistiques des missions, mesures, incidents et volumes d’eau de RoboAgri Kin.">
<meta name="theme-color" content="#183d32">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body data-page="rapports">
<!-- Les indicateurs et graphiques sont calculés dans app.js à partir des données disponibles. -->
<main>
<h1 class="h3 mb-4" style="color:var(--vf)">Rapports et statistiques</h1>
<div class="row g-4 mb-4"><div class="col-sm-6 col-xl-3"><div class="carte kpi"><div class="val" id="tauxMissions"></div><div class="lib">Missions terminées</div></div></div><div class="col-sm-6 col-xl-3"><div class="carte kpi"><div class="val" id="dureeMoyenne"></div><div class="lib">Durée moyenne des missions terminées</div></div></div><div class="col-sm-6 col-xl-3"><div class="carte kpi"><div class="val" id="validRate"></div><div class="lib">Mesures valides</div></div></div><div class="col-sm-6 col-xl-3"><div class="carte kpi"><div class="val" id="nbInc"></div><div class="lib">Incidents reçus</div></div></div><div class="col-sm-6 col-xl-3"><div class="carte kpi"><div class="val" id="volumeRapport"></div><div class="lib">Volume d'eau communiqué</div></div></div></div>
<div class="carte mb-4"><h2>Missions reçues par état</h2><div id="stats"></div></div>
<div class="row g-4"><div class="col-lg-6"><div class="carte"><h2>Évolution de l'humidité</h2><div class="chart" id="graph"></div></div></div>
<div class="col-lg-6"><div class="carte"><h2>Moyenne par zone</h2><div class="chart" id="graphZones"></div></div></div></div>
</main>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script><script src="js/api.js"></script><script src="js/app.js"></script></body></html>
