<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Historique – RoboAgri-Kin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23183d32'/><text x='50' y='68' font-size='56' text-anchor='middle'>🌱</text></svg>">
<meta name="description" content="Parcourez l’historique des activités et événements signalés par le robot RoboAgri Kin.">
<meta name="theme-color" content="#183d32">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body data-page="historique">
<!-- Les contrôles de filtre pilotent la vue chronologique rendue dans #historyTable. -->
<main>
<h1 class="h3 mb-4" style="color:var(--vf)">Historique du robot</h1>
<section class="carte mb-4" aria-label="Filtres de l'historique">
<div class="row g-3">
<div class="col-md-4"><label class="form-label" for="historyType">Type d'événement</label><select class="form-select" id="historyType"><option value="">Tous les types</option></select></div>
<div class="col-md-4"><label class="form-label" for="historyZone">Zone</label><select class="form-select" id="historyZone"><option value="">Toutes les zones</option></select></div>
<div class="col-md-4"><label class="form-label" for="historyDate">Date</label><input class="form-control" id="historyDate" type="date"></div>
</div></section>
<section class="carte"><h2>Journal chronologique</h2><div id="historyTable"></div></section>
</main>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="js/data.js"></script><script src="js/api.js"></script><script src="js/app.js"></script></body></html>
